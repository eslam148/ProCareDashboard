<c-container class="d-flex align-items-center min-vh-100">
  <c-row class="w-100 justify-content-center">
    <c-col xs="12" sm="8" md="6" lg="4">
      <c-card>
        <c-card-header class="text-center">
          <h4>تسجيل الدخول</h4>
        </c-card-header>
        <c-card-body>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label cFormLabel for="username">رقم الهاتف</label>
              <c-input-group>
                <span cInputGroupText>
                  <svg cIcon [name]="'cilUser'"></svg>
                </span>
                <input
                  cFormControl
                  id="username"
                  type="text"
                  formControlName="username"
                  placeholder="أدخل رقم هاتفك"
                  [ngClass]="{'is-invalid': loginForm.get('username')?.invalid && loginForm.get('username')?.touched}"
                />
              </c-input-group>
              <div class="invalid-feedback" *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched">
                رقم الهاتف مطلوب
              </div>
              <div class="invalid-feedback" *ngIf="loginForm.get('username')?.errors?.['pattern'] && loginForm.get('username')?.touched">
                يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام
              </div>
            </div>

            <div class="mb-3">
              <label cFormLabel for="password">كلمة المرور</label>
              <c-input-group>
                <span cInputGroupText>
                  <svg cIcon [name]="'cilLockLocked'"></svg>
                </span>
                <input
                  cFormControl
                  id="password"
                  type="password"
                  formControlName="password"
                  placeholder="أدخل كلمة المرور"
                  [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
                />
              </c-input-group>
              <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched">
                كلمة المرور مطلوبة
              </div>
              <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['minlength'] && loginForm.get('password')?.touched">
                كلمة المرور يجب أن تكون 6 أحرف على الأقل
              </div>
            </div>

            <div class="d-grid">
              <button
                cButton
                color="primary"
                type="submit"
                [disabled]="loginForm.invalid"
              >
                <app-loading *ngIf="loading$ | async"></app-loading>
                <span *ngIf="!(loading$ | async)">تسجيل الدخول</span>
              </button>
            </div>

            <div class="alert alert-danger mt-3" *ngIf="error$ | async as error">
              {{ error }}
            </div>
          </form>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
