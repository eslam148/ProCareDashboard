<div class="min-vh-100 d-flex  justify-content-center bg-light dark:bg-dark">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="12" md="12" xl="12">
        <!-- Removed bg-white, rounded-4, shadow-sm, and adjusted padding -->
        <div class="p-3 p-md-4 w-100">
          <form (ngSubmit)="onRegister()">
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" id="firstName" class="form-control" [(ngModel)]="firstName" name="firstName" required>
              <div *ngIf="!firstName.trim() && submitted" class="text-danger">First Name is required.</div>
            </div>

            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" id="lastName" class="form-control" [(ngModel)]="lastName" name="lastName" required>
              <div *ngIf="!lastName.trim() && submitted" class="text-danger">Last Name is required.</div>
            </div>

            <div class="mb-3">
              <label for="phoneNumber" class="form-label">Phone Number</label>
              <input type="text" id="phoneNumber" class="form-control" [(ngModel)]="phoneNumber" name="phoneNumber" required>
              <div *ngIf="!phoneNumber.trim() && submitted" class="text-danger">Phone Number is required.</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required>
              <div *ngIf="password.length < 6 && submitted" class="text-danger">Password must be at least 6 characters long.</div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
              <div *ngIf="password !== confirmPassword && submitted" class="text-danger">Passwords do not match.</div>
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
          </form>
        </div>
      </c-col>
    </c-row>
  </c-container>
</div>
